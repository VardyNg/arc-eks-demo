githubConfigUrl: "https://github.com/VardyNg/arc-eks-demo"
githubConfigSecret: pre-defined-secret
minRunners: 0
maxRunners: 30

listenerTemplate:
  spec:
    nodeSelector:
      karpenter.sh/capacity-type: on-demand
    containers:
      - name: listener
        securityContext:
          runAsUser: 1000

template:
  spec:
    nodeSelector:
      karpenter.sh/capacity-type: spot
      kubernetes.io/arch: amd64
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "8Gi"