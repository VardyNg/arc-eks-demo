githubConfigUrl: "https://github.com/VardyNg/arc-eks-demo"
githubConfigSecret: pre-defined-secret
minRunners: 0
maxRunners: 30

template:
  spec:
    nodeSelector:
      kubernetes.io/arch: amd64
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "8Gi"